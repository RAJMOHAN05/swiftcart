name: Deploy to AWS EC2

on:
  workflow_run:
    workflows: ["SwiftCart CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: swiftcart-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/swiftcart_ec2
          chmod 600 ~/.ssh/swiftcart_ec2
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy verified main branch
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/swiftcart_ec2 "$EC2_USER@$EC2_HOST" \
            "cd /srv/swiftcart && bash deploy/deploy.sh"
