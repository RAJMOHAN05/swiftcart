name: SwiftCart CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: swiftcart-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: swiftcart_test
          POSTGRES_USER: swiftcart
          POSTGRES_PASSWORD: swiftcart_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swiftcart -d swiftcart_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DB_ENGINE: postgres
      POSTGRES_DB: swiftcart_test
      POSTGRES_USER: swiftcart
      POSTGRES_PASSWORD: swiftcart_test_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check committed migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Django deployment checks
        run: python manage.py check

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test --verbosity=2

      - name: Validate static assets
        run: python manage.py collectstatic --noinput

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag swiftcart:${{ github.sha }} .
